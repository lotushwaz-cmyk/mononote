name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Prepare files
        run: |
          mkdir -p out
          cp build.log out/build.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk out/mononote.apk
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 모노 노트 최신 버전
          body: "휴대폰에서 mononote.apk 를 눌러 내려받아 설치하세요. (빌드 ${{ github.run_number }}, ${{ steps.build.outcome }})"
          files: out/*
          make_latest: true

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
